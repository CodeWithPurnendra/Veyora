<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
    name="description"
    content="Shop Veyora for quality bags, electronics, accessories, footwear and home essentials at honest prices. Free shipping over $50 and easy 30-day returns."
    />
    <meta name="author" content="Veyora" />
    <meta name="robots" content="index, follow" />
    
    <!-- Canonical URL: replace with your real domain once deployed -->
    <link rel="canonical" href="https://www.your-domain.com/" />
    
    <!-- Icons and browser theme -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#1c1917" />

    <!-- Open Graph (link previews on WhatsApp, LinkedIn, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Veyora" />
    <meta property="og:title" content="Veyora | Thoughtfully designed products" />
    <meta
    property="og:description"
    content="Quality everyday essentials at honest prices, delivered to your door."
    />
    <meta property="og:url" content="https://www.your-domain.com/" />
    <meta property="og:image" content="https://www.your-domain.com/og-image.png" />
    
    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Veyora | Thoughtfully designed products" />
    <meta
    name="twitter:description"
    content="Quality everyday essentials at honest prices, delivered to your door."
    />
    <meta name="twitter:image" content="https://www.your-domain.com/og-image.png" />
  </head>
  
  <title>Veyora | Thoughtfully designed products, delivered to your door</title>
  <body>
    <!-- Lets keyboard and screen reader users skip the navbar -->
    <a
      href="#main"
      style="position:absolute;left:-9999px;top:0;z-index:100;background:#1c1917;color:#fff;padding:12px 20px;border-radius:0 0 12px 0;font-family:sans-serif;font-size:14px;"
      onfocus="this.style.left='0'"
      onblur="this.style.left='-9999px'"
    >
      Skip to main content
    </a>

    <div id="root"></div>

    <!-- Shown only if JavaScript is disabled or fails to load -->
    <noscript>
      <p style="padding:24px;font-family:sans-serif;">
        Veyora needs JavaScript to run. Please enable JavaScript in your browser to shop.
      </p>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
